services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: intellectual_game
      POSTGRES_USER: game_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - game_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_admin -d intellectual_game"]
      interval: 5s
      timeout: 3s
      retries: 15

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://game_admin:${POSTGRES_PASSWORD}@db:5432/intellectual_game
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ORGANIZER_TELEGRAM_ID: ${ORGANIZER_TELEGRAM_ID:-707309709}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      WEB_BASE_URL: http://127.0.0.1:8000
      NGROK_API_URL: http://ngrok:4040/api/tunnels
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: ["http", "http://app:8000", "--log", "stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env}
      NGROK_CONFIG: /etc/ngrok.yml
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml:ro
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      app:
        condition: service_healthy

volumes:
  game_postgres_data:
